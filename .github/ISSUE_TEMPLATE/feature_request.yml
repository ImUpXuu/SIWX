name: ✨ 功能建议
description: 提出新功能、增强现有能力或改进使用体验
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请重点说明**你要解决的场景**，而不只是「加一个按钮」——
        这样更容易判断有没有更合适的设计。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认这不是重复建议
          required: true
        - label: 这个建议符合本项目定位（个人微信数据自备份，本地运行，不联网上传）
          required: true

  - type: dropdown
    id: category
    attributes:
      label: 建议类型
      options:
        - 新的导出格式或导出选项
        - 聊天查看 / 搜索体验
        - 媒体与语音处理
        - MCP / AI 接入能力
        - 插件系统与扩展点
        - 平台支持（Windows / macOS / 新系统版本）
        - 性能与资源占用
        - 文档与使用体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景或痛点
      description: 现在是怎么做的？哪里不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 描述你希望它怎么工作；如果有多个方案，可以都写出来
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有用其他工具或临时办法绕过？为什么不理想？
    validations:
      required: false

  - type: input
    id: siwx_version
    attributes:
      label: 当前使用的 siwx 版本
      description: 可选，但有助于判断功能是否已经存在
      placeholder: "例如 5.0.2"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、截图、相关 issue 链接等
    validations:
      required: false
