name: Build WeChat lite Windows

on:
  push:
    branches: ['codex/wechat-lite-*']
    paths: ['safe/**', '.github/workflows/wechat-lite.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: safe
        run: python -m pip install -r requirements-live.txt pyinstaller==6.16.0
      - name: Check browser JavaScript
        run: node --check safe/siwx_safe/live_ui/app.js
      - name: Test extraction adapter and authenticated loopback Web
        working-directory: safe
        run: python -m unittest discover -s tests -v
      - name: Build directory distribution
        working-directory: safe
        run: |
          python -m PyInstaller --noconfirm --clean live.spec
          ./dist/siwx-lite/siwx-lite.exe --help
          ./dist/siwx-lite/siwx-lite.exe --version
          Copy-Item LIVE-README.md dist/siwx-lite/README.txt
          Copy-Item THIRD-PARTY.md dist/siwx-lite/THIRD-PARTY.txt
          Copy-Item ../LICENSE dist/siwx-lite/LICENSE.txt
          Copy-Item live-module-manifest.json dist/siwx-lite/module-manifest.json
          Get-ChildItem dist/siwx-lite -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path dist/siwx-lite).Path.Length + 1)
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash )  $relative"
          } | Set-Content -Encoding utf8 dist/siwx-lite/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: siwx-lite-windows-x64
          path: safe/dist/siwx-lite/
          if-no-files-found: error
          retention-days: 14
