name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 测试闸门：旧配置里 CI 根本没有测试 job，任何 tag 都能在红测试上切出来；
  # 打包/发布/回写 version.json 全部 needs 本 job，测试不过就打不出包。
  test:
    # 覆盖声明的最低版本（3.10）与 macOS：旧配置只有 Windows + 3.12，
    # 3.10 专有语法/标准库差异和 macOS 路径/编码差异都测不到。
    # fail-fast=false：一个平台红了也要看到其余平台的结果。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 隐私红线扫描（AGENTS.md 第三条的 CI 落地）：PR/push 的新增行命中即红灯。
      # 脚本只依赖 stdlib + git，放在装依赖之前，命中时尽快失败。
      # 浅克隆（fetch-depth=1）下三点 diff 需要合并基，故按事件显式取另一端
      # 提交（GitHub 支持按 SHA fetch），再用两点 diff（纯树比较，无需合并基）。
      - name: 隐私红线扫描（PR/push 新增行）
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request)
              if [ -z "$BASE_SHA" ] || ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
                echo "无法获取 PR base 提交（$BASE_SHA），隐私扫描无法确定范围" >&2
                exit 1
              fi
              python scripts/privacy_scan.py --range "$BASE_SHA..HEAD"
              ;;
            push)
              if [[ "$GIT_REF" == refs/tags/* ]]; then
                # tag push：commit 内容与 main 推送时同一 SHA（已扫过），
                # tag 新引入的文本面只有标签注释；浅克隆下 --rev 会把整棵树当新增行，不可用
                echo "tag 推送：扫描标签注释"
                git tag -l --format='%(contents)' "$REF_NAME" | python scripts/privacy_scan.py --stdin
              elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO" ] \
                 && git fetch --no-tags --depth=1 origin "$BEFORE_SHA" 2>/dev/null; then
                python scripts/privacy_scan.py --range "$BEFORE_SHA..HEAD"
              else
                # 首次推送 / 强推后 before 不可达：浅克隆下无可靠 diff 范围，显式跳过
                echo "before=$BEFORE_SHA 不可达（首次推送/强推），跳过增量扫描（提交前本地扫描为准）"
              fi
              ;;
            *)
              echo "event=$EVENT 无固定 diff 范围，跳过隐私红线扫描"
              ;;
          esac
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # 语法门禁：项目没有 package.json（不存在 type=module），直接对 .js 跑
      # `node --check` 会按 CommonJS 解析而误报 import/export。复制成临时 .mjs
      # 后再检查，才是这些浏览器 ES 模块的真实语法环境。runner 自带 node。
      - name: 前端 JS 语法检查
        shell: bash
        run: |
          set -euo pipefail
          node --version
          tmpdir="$(mktemp -d)"
          for f in siwx/ui/app.js siwx/ui/common.js siwx/ui/pages/*.js \
                   siwx/templates/default/renderer.js; do
            [ -f "$f" ] || { echo "缺少文件: $f" >&2; exit 1; }
            tmp="$tmpdir/$(echo "$f" | tr '/' '_').mjs"
            cp "$f" "$tmp"
            node --check "$tmp"
            echo "ok: $f"
          done
      - name: 全量测试
        run: python -m pytest -q -rs
      - name: issue 模板校验不得被静默跳过
        shell: bash
        run: |
          out=$(python -m pytest tests/test_regressions.py::TestContributionTemplates -q -rs)
          echo "$out"
          if echo "$out" | grep -qE "[0-9]+ skipped"; then
            echo "TestContributionTemplates 被跳过（通常是缺 pyyaml），视为失败" >&2
            exit 1
          fi

  # 发布闸门（P1-6）：tag ↔ siwx.__version__ 的校验必须发生在 build/release 之前，
  # 否则 tag 与版本号不匹配时会先把 Release 公开、最后才失败。
  # 注意不能给本 job 加 job 级 if：一旦它被 skip，needs 它的 build-* 会被连带 skip
  # （PR / push main 上就再也测不到打包），所以本 job 始终运行，只在 tag ref 时做真校验。
  version-guard:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验 tag 与 siwx.__version__ 一致
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "非 tag 事件（event=${{ github.event_name }}, ref=$REF），跳过 tag 与版本号校验"
            exit 0
          fi
          # siwx/__init__.py 只含版本号字面量，无需安装项目依赖
          VERSION=$(python -c "from siwx import __version__; print(__version__)")
          if [ "v${VERSION#v}" != "$TAG" ]; then
            echo "tag $TAG 与 siwx.__version__=$VERSION 不一致，在构建前终止" >&2
            exit 1
          fi
          echo "tag $TAG 与 siwx.__version__=$VERSION 一致"
      # 五处版本号一致性（发版清单第 1 条的 --expect 口径）：tag 触发时把 tag 名
      # 交给 check_version_consistency.py 校验五处实际值；非 tag 事件跳过。
      # 本 job 在 build-*/release 之前（needs 链保证），校验不过打不出产物。
      - name: 校验五处版本号一致（--expect tag）
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "非 tag 事件（event=${{ github.event_name }}, ref=$REF），跳过 --expect 校验"
            exit 0
          fi
          # 脚本只依赖 stdlib，按自身位置定位仓库根，无需安装项目依赖
          python scripts/check_version_consistency.py --expect "$TAG"

  build-windows:
    needs: [test, version-guard]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: PyInstaller 打包 (exe)
        run: pyinstaller --clean -y packaging/siwx-win.spec
      # 冒烟：产物连 --help 都跑不起来时，后面再算 SHA256 / 发 Release 毫无意义。
      # 用 bash 而不是 PowerShell，省掉 $LASTEXITCODE 手工判断（bash -e 直接失败）。
      - name: 产物冒烟（--help）
        shell: bash
        run: dist/stories-in-wx.exe --help
      - name: 重命名产物
        run: |
          $tag = "${{ github.ref_name }}"
          Move-Item dist/stories-in-wx.exe "dist/stories-in-wx-${tag}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: stories-in-wx-windows
          path: dist/*.exe

  build-macos:
    needs: [test, version-guard]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # 交付物明确为 arm64-only（packaging/siwx-mac.spec 声明 target_arch="arm64"）。
      # macos-latest 的架构随 runner 镜像漂移；这里断言失败而不是静默产出 x86_64 包。
      - name: 断言 runner 架构为 arm64
        run: |
          ARCH="$(uname -m)"
          echo "runner arch: $ARCH"
          if [ "$ARCH" != "arm64" ]; then
            echo "macOS 产物仅支持 Apple Silicon（arm64），当前 runner 为 $ARCH；请确认 macos-latest 是否切换了架构" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: PyInstaller 打包 (.app)
        run: pyinstaller --clean -y packaging/siwx-mac.spec
      # 冒烟：直接跑 .app 内部二进制（Launcher 之外的真实入口），--help 必须为 0。
      - name: 产物冒烟（--help）
        run: dist/stories-in-wx.app/Contents/MacOS/stories-in-wx --help
      - name: 生成 DMG
        run: |
          mkdir -p dist/dmg-staging
          cp -R dist/stories-in-wx.app dist/dmg-staging/
          ln -s /Applications dist/dmg-staging/Applications
          TAG="${{ github.ref_name }}"
          hdiutil create -volname "stories-in-wx" \
            -srcfolder dist/dmg-staging \
            -ov -format UDZO \
            "dist/stories-in-wx-${TAG}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: stories-in-wx-macos
          path: dist/*.dmg

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 整理产物
        run: |
          mkdir -p release
          cp artifacts/stories-in-wx-windows/*.exe release/
          cp artifacts/stories-in-wx-macos/*.dmg release/
          ls -la release/
      - name: 计算 SHA-256
        working-directory: release
        run: |
          for f in *; do sha256sum "$f" >> SHA256SUMS.txt; done
          cat SHA256SUMS.txt
      - name: 提取 tag 更新内容
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > release/RELEASE_NOTES.md
          if [ ! -s release/RELEASE_NOTES.md ]; then
            echo "未能读取 $TAG 的 annotated tag 发布说明" >&2
            exit 1
          fi
          cat release/RELEASE_NOTES.md
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.dmg
            release/SHA256SUMS.txt
          body_path: release/RELEASE_NOTES.md
          generate_release_notes: false

  # version.json 写的是「已发布资产」的下载地址：必须在 Release 产出资产之后再生成/提交，
  # 否则自动更新链会指向 404。因此这里保留 needs: [release] 的时序（与清单“生成前移”的
  # 表述不同：tag ↔ 版本号校验已经前移到 version-guard，Release 之前的闸门由它负责）。
  # 条件收紧为仅 tag ref：workflow_dispatch 时 github.ref_name 是分支名（如 main），
  # 用它生成 version.json 会写入错误版本并提交到 main。
  version-json:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 生成 version.json（自动更新用）
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          python3 scripts/generate_version_json.py --tag "$TAG" --repo "$REPO"
          cp version.json /tmp/siwx-version.json
      - name: 提交 version.json 到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp /tmp/siwx-version.json version.json
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json 无变化"
          else
            git commit -m "chore(release): 更新 version.json → ${{ github.ref_name }}"
            git push origin main
          fi
