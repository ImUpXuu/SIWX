<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#f6f6f4">
<title>stories-in-wx</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2307c160'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%20fill='%23ffffff'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/chat.css"><link rel="stylesheet" href="/export.css"><link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="logo">✦</span>
      <span class="brand-name">stories</span><span class="brand-dim">-in-</span><span class="brand-name">wx</span>
    </div>

    <!-- 全局账号卡：全站唯一的微信号入口，切换对所有页面生效 -->
    <button class="acc-card" id="acc-card" type="button" aria-haspopup="true" aria-expanded="false">
      <span class="acc-ava"><span id="acc-initial">…</span><img id="acc-img" alt="" hidden></span>
      <span class="acc-meta">
        <b id="acc-name">检测中…</b>
        <span id="acc-wxid"></span>
      </span>
      <span class="acc-caret">▾</span>
    </button>
    <div class="acc-pop" id="acc-pop" role="listbox" aria-label="切换微信号" hidden></div>

    <nav class="menu" id="menu">
      <a href="#/chat" data-page="chat"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h4v4l5-4h7a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/></svg></span><span>聊天查看</span></a>
      <a href="#/export" data-page="export"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span><span>导出</span></a>
    </nav>

    <div class="side-foot">
      <div class="mini" id="side-wx" role="status">请选择账号</div><div class="side-tools"><button id="close-data" class="mini-btn" type="button">关闭数据</button><button id="stop" class="mini-btn" type="button">停止程序</button></div>
      <button id="side-theme" class="mini-btn" title="切换主题" aria-label="切换主题">☾</button>
    </div>
  </aside>
  <main id="view" class="view"><section id="chat-page"><div class="chat-wrap" id="chat-wrap">
  <aside class="c-list">
    <div class="c-top">
      <div class="c-toolbar">
        <input id="c-search" placeholder="搜索会话…（支持正则）" aria-label="搜索会话">
        <button id="c-refresh" title="重新提取当前账号" aria-label="重新提取当前账号">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>
    <div id="c-sessions"></div>
  </aside>

  <section class="c-main">
    <div class="c-head">
      <button id="c-back" aria-label="返回会话列表">←</button>
      <div class="c-titlebox">
        <b id="c-title">微信</b>
        <span id="c-sub">选择一个会话查看聊天记录</span>
      </div>
      <div class="c-actions">
        <button id="c-select" class="c-action" disabled>选择</button>
        <button id="c-copy-selected" class="c-action hidden">复制所选</button>
        <button id="c-cancel-select" class="c-action hidden">取消</button>
        <button id="c-export" class="c-action c-action-primary" disabled>导出</button>
      </div>
    </div>

    <div class="c-filter" id="c-filter">
      <div class="c-filter-row">
        <input id="c-msg-q" placeholder="搜索聊天记录…" aria-label="搜索聊天记录">
        <button id="c-msg-search" class="c-action" type="button">搜索</button>
        <button id="c-filter-exit" class="c-action hidden" type="button">退出筛选</button>
      </div>
      <div class="c-chips" id="c-kind-chips">
        <button class="chip on" data-kind="" type="button">全部</button>
        <button class="chip" data-kind="text" type="button">文本</button>
        <button class="chip" data-kind="image" type="button">图片</button>
        <button class="chip" data-kind="video" type="button">视频</button>
        <button class="chip" data-kind="voice" type="button">语音</button>
        <button class="chip" data-kind="sticker" type="button">表情</button>
        <button class="chip" data-kind="link" type="button">链接/文件</button>
        <button class="chip" data-kind="record" type="button">聊天记录</button>
        <button class="chip" data-kind="system" type="button">系统</button>
      </div>
      <div class="date-filters"><label>开始 <input id="c-since" type="date"></label><label>结束 <input id="c-until" type="date"></label></div>
      <div class="c-filter-info hidden" id="c-filter-info"></div>
    </div>

    <div class="c-body">
      <div id="c-msgs">
        <div class="c-tip">选择一个会话查看聊天记录</div>
      </div>
      <aside class="c-timeline" id="c-timeline">
        <button class="tl-trigger" id="c-timeline-trigger" type="button" title="按时间跳转" aria-label="打开时间轴">时间</button>
        <div class="tl-panel">
          <div class="tl-head"><b>聊天时间轴</b><span>悬停或点击月份展开</span></div>
          <div id="c-timeline-list" class="tl-list">
            <div class="tl-empty">打开会话后可按月份跳转</div>
          </div>
        </div>
      </aside>

    </div>
      <div class="chat-pager"><button id="c-prev" class="c-action" type="button">上一页</button><span id="c-page"></span><button id="c-next" class="c-action" type="button">下一页</button></div>
  </section>
</div>
</section><section id="export-page" hidden><div class="export-wrap">
  <aside class="e-list">
    <div class="e-top">
      <input id="e-search" placeholder="搜索会话…" aria-label="搜索会话">
      <div class="e-filter-chips" id="e-filter-chips">
        <button class="chip on" type="button" data-f="all">全部</button>
        <button class="chip" type="button" data-f="chat">好友</button>
        <button class="chip" type="button" data-f="group">群聊</button>
        <button class="chip" type="button" data-f="official">公众号</button>
      </div>
      <label class="e-selall"><input type="checkbox" id="e-selall"> 全选</label>
    </div>
    <div id="e-sessions"></div>
  </aside>
  <section class="e-side">
    <div class="card">
      <div class="card-head">
        <h2>导出配置</h2>
        <span class="hint" id="e-hint">已选 0 个会话</span>
        <button id="e-roster-btn" class="mini-btn" type="button">查看名单</button>
      </div>
      <div id="e-range-banner" class="e-range-banner hidden"></div>
      <div class="f-grid2">
        <label>导出格式<select id="e-fmt"><option value="html">HTML 网页</option><option value="md">Markdown</option><option value="txt">TXT 文本</option><option value="csv">CSV 表格</option><option value="json">JSON 数据</option></select></label>
        <label>打包方式<select id="e-pack"><option value="auto">单会话文件 / 多会话 ZIP</option><option value="zip">ZIP 压缩包</option></select></label>
        <label>开始日期<input id="e-start" type="date"></label>
        <label>结束日期<input id="e-end" type="date"></label>
      </div>
      <div class="f-grid2 extra-filters"><label>搜索内容<input id="e-query" placeholder="搜索正文或发送者" maxlength="500"></label><label>消息类型<select id="e-kind"><option value="">全部</option><option value="text">文本</option><option value="image">图片</option><option value="video">视频</option><option value="voice">语音</option><option value="sticker">表情</option><option value="link">链接/文件</option><option value="record">聊天记录</option><option value="system">系统</option></select></label></div><div class="f-checks">
        <label class="f-chk"><input type="checkbox" id="e-noofficial" checked> 排除公众号</label>
      </div>
      <div class="g-nav"><button id="e-run" class="btn btn-primary" disabled>开始导出</button></div>
    </div>

    <div class="card hidden" id="e-progress-card">
      <div class="progress"><div class="bar" id="e-bar"></div></div>
      <div class="e-prog-row">
        <div class="e-prog-text" id="e-prog-text"></div>
        <button id="e-cancel" class="mini-btn hidden" type="button">取消下载</button>
      </div>
    </div>

    <div class="card e-logcard">
      <div class="card-head"><h2>运行日志</h2>
        <span class="e-log-actions">
          <button id="e-log-pause" class="mini-btn" type="button" aria-pressed="false">暂停</button>
          <button id="e-log-copy" class="mini-btn" type="button">复制日志</button>
        </span>
      </div>
      <div class="console" id="e-log"></div>
      <div id="e-result"></div>
    </div>
  </section>
</div>

<div class="e-modal hidden" id="e-roster-modal" role="dialog" aria-modal="true" aria-labelledby="e-roster-title">
  <div class="e-modal-card">
    <div class="e-modal-head">
      <b id="e-roster-title">导出名单</b>
      <button id="e-roster-close" class="mini-btn" aria-label="关闭">×</button>
    </div>
    <div class="e-modal-toolbar">
      <input id="e-roster-re" placeholder="排除正则（忽略大小写）：命中的昵称或微信号不导出，如 ^微信支付|^文件传输助手">
      <div class="e-roster-tools">
        <div class="e-roster-chips" id="e-roster-chips">
          <button class="chip on" type="button" data-f="all">全部</button>
          <button class="chip" type="button" data-f="in">将导出</button>
          <button class="chip" type="button" data-f="ex">被排除</button>
        </div>
        <input id="e-roster-search" placeholder="名单内搜索…">
        <button id="e-roster-reset" class="mini-btn" type="button" title="清掉所有手动勾选，恢复正则与公众号开关的默认判定">重置手动勾选</button>
      </div>
      <span class="hint" id="e-roster-hint"></span>
    </div>
    <div class="e-modal-body" id="e-roster-list"></div>
    <div class="e-modal-foot">
      <span class="hint" id="e-roster-count"></span>
      <button id="e-roster-copy" class="btn btn-primary" type="button">复制整个名单</button>
    </div>
  </div>
</div>
</section></main>
</div>
<div id="account-modal" class="ob-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="ob-title">
  <div class="ob-card"><div class="ob-head"><div class="ob-steps"><span class="g-chip on">1 选择账号</span><span class="g-chip">2 提取并打开</span></div><button id="ob-close" class="btn btn-sm ob-close" type="button" aria-label="关闭">×</button></div>
  <div class="ob-body"><h2 id="ob-title" class="g-title">选择微信号</h2><p class="dim g-desc">请选择本人的微信账号，并保持微信登录。</p><div id="ob-accounts" class="accounts"></div>
  <p id="ob-empty" class="empty" hidden>未找到账号。请在启动菜单 14 选择微信数据目录后重新启动。</p><label class="f-chk"><input id="ob-consent" type="checkbox">我确认仅处理本人有权访问的微信数据</label>
  <div class="ob-actions"><button id="ob-open" class="btn btn-primary" type="button">提取并打开</button><span id="ob-status" role="status"></span></div></div></div></div>
<div id="toast" role="status" hidden></div><script src="/app.js"></script></body></html>
