<div class="export-wrap">
  <aside class="e-list">
    <div class="e-top">
      <select id="e-account"></select>
      <input id="e-search" placeholder="搜索会话…">
      <label class="e-selall"><input type="checkbox" id="e-selall"> 全选</label>
    </div>
    <div id="e-sessions"></div>
  </aside>
  <section class="e-side">
    <div class="card">
      <div class="card-head"><h2>导出配置</h2><span class="hint" id="e-hint">已选 0 个会话</span></div>
      <div class="f-grid2">
        <label>导出格式
          <select id="e-fmt">
            <option value="json">JSON（结构化全量）</option>
            <option value="html">HTML（自包含网页）</option>
            <option value="txt">TXT（纯文本）</option>
            <option value="csv">CSV（表格）</option>
            <option value="xlsx">XLSX（Excel）</option>
            <option value="markdown">Markdown</option>
            <option value="toml">TOML</option>
            <option value="sqlite">SQLite 数据库</option>
          </select>
        </label>
        <label>打包方式
          <select id="e-pack">
            <option value="folder">仅文件夹（每会话一个子文件夹）</option>
            <option value="single">单个 ZIP（全部会话打包一个）</option>
            <option value="each">每会话一个 ZIP</option>
          </select>
        </label>
        <label>开始日期<input type="date" id="e-start"></label>
        <label>结束日期<input type="date" id="e-end"></label>
      </div>
      <div class="f-checks">
        <label class="f-chk"><input type="checkbox" id="e-msg" checked> 💬 消息记录</label>
        <label class="f-chk"><input type="checkbox" id="e-media"> 🖼 媒体图片（按需解密）</label>
        <label class="f-chk"><input type="checkbox" id="e-voice"> 🎤 语音（转 WAV，失败保留 SILK）</label>
        <label class="f-chk"><input type="checkbox" id="e-ava"> 👤 联系人头像</label>
      </div>
      <div class="g-nav"><button id="e-run" class="btn btn-primary" disabled>📦 开始导出</button></div>
    </div>

    <div class="card" id="e-progress-card" style="display:none">
      <div class="progress"><div class="bar" id="e-bar" style="width:0%"></div></div>
    </div>

    <div class="card e-logcard">
      <div class="card-head"><h2>运行日志</h2></div>
      <div class="console" id="e-log"></div>
      <div id="e-result"></div>
    </div>
  </section>
</div>
