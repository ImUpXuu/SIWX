<div class="export-wrap">
  <aside class="e-list">
    <div class="e-top">
      <input id="e-search" placeholder="搜索会话…" aria-label="搜索会话">
      <label class="e-selall"><input type="checkbox" id="e-selall"> 全选</label>
    </div>
    <div id="e-sessions"></div>
  </aside>
  <section class="e-side">
    <div class="card">
      <div class="card-head"><h2>导出配置</h2><span class="hint" id="e-hint">已选 0 个会话</span></div>
      <div id="e-range-banner" class="e-range-banner hidden"></div>
      <div class="f-grid2">
        <label>导出格式<div id="e-fmt"></div></label>
        <label>打包方式<div id="e-pack"></div></label>
        <label>HTML 模板<div id="e-tpl"></div></label>
        <label>开始日期<div id="e-start"></div></label>
        <label>结束日期<div id="e-end"></div></label>
      </div>
      <div class="f-checks">
        <label class="f-chk"><input type="checkbox" id="e-msg" checked> 消息记录</label>
        <label class="f-chk"><input type="checkbox" id="e-media"> 媒体图片（按需解密）</label>
        <label class="f-chk"><input type="checkbox" id="e-voice"> 语音（转 WAV，失败保留 SILK）</label>
        <label class="f-chk"><input type="checkbox" id="e-ava"> 联系人头像</label>
      </div>
      <div class="g-nav"><button id="e-run" class="btn btn-primary" disabled>开始导出</button></div>
    </div>

    <div class="card hidden" id="e-progress-card">
      <div class="progress"><div class="bar" id="e-bar" style="width:0%"></div></div>
    </div>

    <div class="card e-logcard">
      <div class="card-head"><h2>运行日志</h2></div>
      <div class="console" id="e-log"></div>
      <div id="e-result"></div>
    </div>
  </section>
</div>
