<div class="logs">
  <div class="card">
    <div class="card-head"><h2>运行日志</h2>
      <span class="hint" id="log-count">0 条</span></div>
    <div class="log-actions">
      <button id="log-pause" class="btn">⏸ 暂停</button>
      <button id="log-clear" class="btn">🗑 清空</button>
      <label class="chk"><input type="checkbox" id="log-auto" checked> 自动滚动</label>
    </div>
    <div id="log-box" class="console"></div>
  </div>
</div>
