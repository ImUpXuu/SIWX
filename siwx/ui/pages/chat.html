<div class="chat-wrap" id="chat-wrap">
  <aside class="c-list">
    <div class="c-top">
      <select id="c-account"></select>
      <div class="c-toolbar">
        <input id="c-search" placeholder="搜索会话…">
        <button id="c-refresh" title="增量同步">⟳</button>
      </div>
    </div>
    <div id="c-sessions"></div>
  </aside>
  <section class="c-main">
    <div class="c-head">
      <button id="c-back">←</button>
      <b id="c-title">微信</b>
      <span id="c-sub"></span>
      <button id="c-export">📦 导出</button>
    </div>
    <div id="c-msgs">
      <div class="c-tip">选择一个会话查看聊天记录</div>
    </div>
  </section>
</div>
